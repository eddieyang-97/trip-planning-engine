# Free web service only. Supabase supplies the external database and OAuth server.
services:
  - type: web
    name: trip-planning-engine
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: hosted
      - key: MIGRATE_ON_START
        value: "true"
      - key: DATABASE_CA_FILE
        value: certs/supabase-prod-ca-2021.crt
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_g2fwpOlsm_A_0WkbKU6ukA_fstaWI6I
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: SUPABASE_AUTH_ISSUER
        sync: false
