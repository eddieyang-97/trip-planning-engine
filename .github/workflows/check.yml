name: Check
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  # Cancel superseded PR checks, but never discard validation for a main commit.
  # Main uses its SHA because a shared main group can cancel pending runs.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: travel_test
          POSTGRES_PASSWORD: ephemeral_test_only
          POSTGRES_DB: travel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travel_test -d travel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://travel_test:ephemeral_test_only@127.0.0.1:5432/travel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - run: npm run build
      - run: npm test
